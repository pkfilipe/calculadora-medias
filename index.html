<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Médias</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Calculadora de Médias</h1>
    <p class="descricao">Insira as três notas para calcular a média final:</p>

    <div class="form-group">
      <label for="nota1">1ª Nota:</label>
      <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Ex: 7.5">
    </div>

    <div class="form-group">
      <label for="nota2">2ª Nota:</label>
      <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="Ex: 8.0">
    </div>

    <div class="form-group">
      <label for="nota3">3ª Nota:</label>
      <input type="number" id="nota3" min="0" max="10" step="0.1" placeholder="Ex: 6.5">
    </div>

    <div class="botoes">
      <button id="btnCalcular">Calcular Média</button>
      <button id="btnLimpar" class="btn-limpar">Limpar</button>
    </div>

    <div id="resultado" class="resultado escondido">
      <p id="textoMedia">Média: <strong id="valorMedia">0.0</strong></p>
      <p id="situacao" class="situacao"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
